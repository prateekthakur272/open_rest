name: Release

# Pushing a tag like v2.0.0 builds every platform and publishes a GitHub Release.
# Run it by hand (Actions > Release > Run workflow) to build the installers without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  APP_NAME: OpenRest

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from pubspec.yaml
        id: version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $version"

      - name: Check the tag matches the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # A pre-release suffix on the tag (v2.1.0-beta.1) is allowed; the numeric part must match.
          if [ "${tag%%-*}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get

      # flutter_js loads its QuickJS bridge as a native library. Under `flutter test` on Linux it looks for
      # libquickjs_c_bridge_plugin.so on the library path, so point it at the copy shipped inside the package.
      - name: Locate the QuickJS bridge library
        run: |
          lib=$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*flutter_js-*/linux/shared/libquickjs_c_bridge_plugin.so' | head -n 1)
          if [ -z "$lib" ]; then
            echo "::error::libquickjs_c_bridge_plugin.so not found in the pub cache"
            exit 1
          fi
          echo "QuickJS bridge: $lib"
          echo "LIBQUICKJSC_TEST_PATH=$lib" >> "$GITHUB_ENV"

      - run: flutter analyze
      - run: flutter test --timeout 60s

  macos:
    # One universal build: Flutter's release app contains both arm64 and x86_64, so the same DMG runs on
    # Apple Silicon and Intel Macs.
    name: macOS (Apple Silicon + Intel)
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build macos --release

      # Verifies the signature and that both architectures are present, then builds the drag-to-Applications DMG.
      - name: Package DMG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          packaging/macos/build-dmg.sh "$VERSION" \
            "build/macos/Build/Products/Release/${APP_NAME}.app" dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build windows --release

      # Flutter apps need the Visual C++ runtime. Shipping the three DLLs next to the exe (app-local deployment)
      # means the app starts even on a machine that never installed the redistributable.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $env:SystemRoot "System32/$dll"
            if (Test-Path $src) { Copy-Item $src $out -Force; Write-Host "bundled $dll" }
            else { Write-Warning "$dll not found on this runner" }
          }

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force dist | Out-Null
          # MSI versions are numeric (major.minor.build): drop a pre-release suffix such as -beta.1.
          $msiVersion = ($env:VERSION -split '-')[0]
          $build = (Resolve-Path "build/windows/x64/runner/Release").Path
          $icon = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
          wix build packaging/windows/openrest.wxs -arch x64 `
            -d "Version=$msiVersion" -d "BuildDir=$build" -d "IconPath=$icon" `
            -o "dist/$env:APP_NAME-$env:VERSION-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Check the MSI installs and uninstalls
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $exe = "$env:ProgramFiles\OpenRest\OpenRest.exe"
          $p = Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "OpenRest.exe was not installed to $exe" }
          if (-not (Test-Path "$env:ProgramFiles\OpenRest\data\app.so")) { throw "data folder was not installed" }
          Write-Host "installed OK"
          $p = Start-Process msiexec -ArgumentList "/x", "`"$msi`"", "/qn", "/l*v", "uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "OpenRest.exe is still there after uninstall" }
          Write-Host "uninstalled OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.msi
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BUNDLE: build/linux/x64/release/bundle
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Package .deb
        run: packaging/linux/build-deb.sh "$VERSION" "$BUNDLE" dist

      - name: Check the .deb installs and starts linking
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/openrest
          # Every shared library the app needs must resolve after a normal install.
          if ldd /opt/openrest/OpenRest | grep "not found"; then
            echo "::error::the installed app has unresolved shared libraries"
            exit 1
          fi

      - name: Package .rpm
        run: |
          sudo apt-get install -y rpm
          sudo gem install --no-document fpm
          packaging/linux/build-rpm.sh "$VERSION" "$BUNDLE" dist
          rpm -qpi dist/*.rpm
          rpm -qpl dist/*.rpm
          rpm -qpR dist/*.rpm

      - name: Package AppImage
        env:
          # The runner has no FUSE; let the tool unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          packaging/linux/build-appimage.sh "$VERSION" "$BUNDLE" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    # Only a pushed version tag publishes; a manual run just leaves the build artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
